name: Bug report
description: Report a reproducible TinyOps Mermaid problem using safe sample data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve TinyOps Mermaid. This issue is public. Do not include confidential diagram source, page content, personal data, tenant URLs, tokens, attachment identifiers, or security vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      description: Use non-confidential sample content only.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Editor or live preview
        - Page view or large-diagram controls
        - SVG or PNG download
        - PDF export
        - Word export
        - Installation or permissions
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 20, Chrome 140, Firefox 142…
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed confidential data, personal data, tenant URLs, tokens, identifiers, and security-sensitive details.
          required: true
